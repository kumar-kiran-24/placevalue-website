# PlaceValue Static Website - Nginx Server Configuration for Ubuntu
# Location: /etc/nginx/sites-available/placevalue
# Symlink: ln -s /etc/nginx/sites-available/placevalue /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Replace with your actual domain or IP

    # Path where build/client contents are deployed on Ubuntu
    root /var/www/placevalue-new-web;
    index index.html;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML - Never cache so updates are immediate
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite / React Router hashed build assets (JS, CSS, fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Background MP4 Videos (cinematic hero loops) with byte-range streaming support
    location ~* \.(mp4|webm)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # Static Media & Images
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA Routing Fallback - Routes all clean URLs to index.html
    # Supports /, /about, /consultancy, /taskverse, /insights, /contact
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 404 /index.html;
}

