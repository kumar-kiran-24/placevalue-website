# PlaceValue Website - Nginx Production & Staging Server Configuration
# Location on Ubuntu: /etc/nginx/sites-available/placevalue
# Enable symlink: ln -s /etc/nginx/sites-available/placevalue /etc/nginx/sites-enabled/

# ==============================================================================
# 1. STAGING ENVIRONMENT (new.placevalue.in)
# ==============================================================================
# Dedicated staging server block.
# Emits X-Robots-Tag: noindex, nofollow response header on all HTML requests to
# prevent Google and other search engines from indexing the staging domain,
# while keeping pages crawlable so Googlebot can read the noindex directive.
# Canonical URLs remain https://placevalue.in/... in HTML metadata.
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name new.placevalue.in;

    root /var/www/placevalue-new-web;
    index index.html;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Security & Staging Protection Headers
    # MANDATORY: Prevent staging domain from ever appearing in search index
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML - Never cache so staging deployments take effect instantly
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Vite / React Router hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Background MP4 Videos with byte-range streaming support
    location ~* \.(mp4|webm)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # Static Media & Images
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 301 Permanent Redirect for independent consultancy website
    location = /consultancy {
        return 301 https://consultancy.placevalue.in$is_args$args;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}

# ==============================================================================
# 2. OFFICIAL PRODUCTION ENVIRONMENT (placevalue.in & www.placevalue.in)
# ==============================================================================
# Authoritative production server block.
# Allows full Googlebot indexing, rich snippet generation, and sitelink discovery.
# Does NOT emit noindex header.
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name placevalue.in www.placevalue.in;

    root /var/www/placevalue-new-web;
    index index.html;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Security Headers (Indexable Production - NO noindex header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML - Never cache so code updates are immediate
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite / React Router hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Background MP4 Videos with byte-range streaming support
    location ~* \.(mp4|webm)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # Static Media & Images
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 301 Permanent Redirect for independent consultancy website
    location = /consultancy {
        return 301 https://consultancy.placevalue.in$is_args$args;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}

